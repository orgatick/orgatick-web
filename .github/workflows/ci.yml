name: CI

on:
  push:
    branches:
      - main
      - "features/**"
  pull_request:
    branches:
      - main
      - "features/**"

jobs:
  ci:
    runs-on: ubuntu-latest

    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm -w -r --if-present run lint

      - name: Run typecheck
        run: pnpm -w -r --if-present run check-types

      - name: Run tests
        run: pnpm -w -r --if-present test

      - name: Build packages
        run: pnpm -w -r --if-present run build

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            apps/**/.next
            packages/**/dist
            dist